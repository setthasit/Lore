version: "2"

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
  settings:
    gosec:
      # Rules that are structurally wrong for this codebase rather than
      # findings waiting to be fixed:
      #   G115 - the gRPC mappers narrow int line numbers to the int32 the
      #          proto declares; no source file has 2^31 lines.
      #   G118 - the scheduler's cancel func is stored on start and called
      #          from the fx OnStop hook, which gosec cannot follow.
      #   G201 - the only formatted SQL substitutes a column constant and a
      #          generated `?,?,?` list; values always arrive as args.
      #   G202 - the UNION builders concatenate constant fragments and column
      #          names from a closed switch, never caller strings.
      #   G204 - the gitrepo connector exists to shell out to git; every argv
      #          it passes is assembled in-process, never from user input.
      #   G301 - the local index directory is created 0o755 on purpose so the
      #          owning user can inspect it with ordinary tools.
      #   G302 - `lore init` writes a config of environment variable names,
      #          never secrets, so 0o644 is intentional.
      #   G304 - a local CLI reads the paths it is handed; config, bundle and
      #          source files all arrive as arguments, not as untrusted input.
      #   G404 - retry jitter and benchmark seeds want math/rand; crypto/rand
      #          would buy nothing and cost throughput.
      excludes:
        - G115
        - G118
        - G201
        - G202
        - G204
        - G301
        - G302
        - G304
        - G404
  exclusions:
    rules:
      # Tests deliberately write fixtures with loose permissions, read paths
      # built from table-driven names, and hardcode obviously fake tokens.
      - path: _test\.go
        linters:
          - gosec
