version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - staticcheck
  settings:
    # These rules enforce the boundary table under "Layout" in docs/v3/08-extensibility.md.
    depguard:
      rules:
        sdk:
          files:
            - "**/sdk/**"
          allow:
            - "$gostd"
            - "github.com/setthasit/Lore/sdk"
        plugins:
          files:
            - "**/plugins/**"
          allow:
            - "$gostd"
            - "github.com/setthasit/Lore/sdk"
            - "github.com/setthasit/Lore/plugins"
        engine:
          files:
            - "**/internal/**"
          deny:
            - pkg: "github.com/setthasit/Lore/plugins"
              desc: the engine must not know a plugin by name; wire through the registry
    gosec:
      # Findings that are structurally wrong here rather than waiting to be fixed:
      #   G115 - the gRPC mappers narrow int line numbers to the int32 the proto declares.
      #   G118 - the scheduler's cancel func is stored on start and called from the fx OnStop hook.
      #   G201 - formatted SQL substitutes column constants, a generated `?,?,?` list and the
      #          vector width; values always arrive as args.
      #   G202 - the UNION builders concatenate constant fragments, never caller strings.
      #   G301 - the local index directory is 0o755 so the owning user can inspect it.
      #   G302 - `lore init` writes a config of environment variable names, never secrets.
      #   G304 - config, bundle and source paths all arrive as CLI arguments.
      #   G404 - retry jitter and plugin request-id prefixes want math/rand, not crypto/rand.
      excludes:
        - G115
        - G118
        - G201
        - G202
        - G301
        - G302
        - G304
        - G404
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      # The git plugin exists to shell out to git; every argv it passes is assembled in-process.
      - path: ^plugins/code/git/git\.go$
        text: "^G204"
        linters:
          - gosec
      # plugbuild runs the go toolchain and the binary it has just produced, both named by the build itself.
      - path: ^internal/plugbuild/plugbuild\.go$
        text: "^G204"
        linters:
          - gosec
