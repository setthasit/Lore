name: scan

on:
  push:
    branches: [main]
  pull_request:
  # Newly published advisories affect unchanged code, so scan on a timer too.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      # The action checks out the repository itself.
      - uses: golang/govulncheck-action@v1
        with:
          # Stdlib advisories are reported against the toolchain in use, so
          # scanning has to happen on the current patch release.
          go-version-input: stable
          check-latest: true
          go-package: ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR comments: findings surface in the job summary, the uploaded
          # SARIF artifact, and the failing exit code, none of which need
          # write permissions that fork pull requests never get.
          GITLEAKS_ENABLE_COMMENTS: false
